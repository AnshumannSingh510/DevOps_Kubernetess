global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  # Prometheus scraping itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # ---------------------------------------------------------------------
  # Spring Boot application — direct static target using the in-cluster
  # Kubernetes Service DNS name (works because Prometheus itself runs
  # inside the cluster, in the "monitoring" namespace).
  # Kept in addition to the dynamic pod-discovery job below so metrics
  # keep flowing even if annotations are ever removed from the Deployment.
  # ---------------------------------------------------------------------
  - job_name: "devops-demo-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["devops-demo.devops-demo.svc.cluster.local:8080"]
        labels:
          application: "devops-demo"
          environment: "local-kubernetes"

  # ---------------------------------------------------------------------
  # Kubernetes pod discovery (dynamic — automatically finds any pod in
  # any namespace annotated with the three prometheus.io/* annotations
  # below, so new services get scraped without editing this file).
  # Scrapes any pod annotated with:
  #   prometheus.io/scrape: "true"
  #   prometheus.io/path:   "/actuator/prometheus"
  #   prometheus.io/port:   "8080"
  # ---------------------------------------------------------------------
  - job_name: "kubernetes-pods"
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  # kube-state-metrics: exposes pod status, restarts, deployment status, etc.
  - job_name: "kube-state-metrics"
    static_configs:
      - targets: ["kube-state-metrics:8080"]

  # node-exporter: host/node CPU, memory, disk, network
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  # cAdvisor via kubelet (container CPU/memory) — only reachable when
  # Prometheus itself runs inside the cluster with correct RBAC.
  - job_name: "kubernetes-cadvisor"
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      insecure_skip_verify: true
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs:
      - role: node
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        regex: (.+)
        target_label: __metrics_path__
        replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
