# OPTIONAL. This Ingress only works if you have an ingress controller installed
# in your cluster (e.g. ingress-nginx). Docker Desktop Kubernetes does NOT ship
# with one by default, so this file is provided for completeness / the "advanced"
# path described in the README, but is NOT required to run the project locally.
#
# To install ingress-nginx locally (optional):
#   kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/cloud/deploy.yaml
#
# If you don't install an ingress controller, use the NodePort service
# (devops-demo-nodeport, see service.yaml) or `kubectl port-forward` instead.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-demo
  namespace: devops-demo
  labels:
    app: devops-demo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: devops-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-demo
                port:
                  number: 8080
