sonar.projectKey=devops-demo
sonar.projectName=DevOps Demo
sonar.projectVersion=1.0.0

# Source layout
sonar.sources=app/src/main
sonar.tests=app/src/test
sonar.java.binaries=app/target/classes
sonar.java.test.binaries=app/target/test-classes

# Coverage report produced by the JaCoCo Maven plugin (see app/pom.xml)
sonar.coverage.jacoco.xmlReportPaths=app/target/site/jacoco/jacoco.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/config/**,**/DevopsDemoApplication.java
